sources:
  - name: stripe
    description: Copy of Stripe. It consist of one table - payments.
    database: raw
    schema: raw_source    
    tables:
      - name: payments
        identifier: stripe_payments
        description: Raw data about payments to orders. Each row is a one payment.
        columns:
          - name: id
            data_type: integer
            description: Primary key. Unique ID of payment.

          - name: orderid
            data_type: integer
            description: Foreign key. ID of order related to the payment.

          - name: paymentmethod
            data_type: text
            description: Method that payment was made with.

          - name: status
            data_type: text
            description: Status of the payment. Info if it passed or was rejected.

          - name: amount
            data_type: integer
            description: Payment value.

          - name: created
            data_type: date
            description: When payment was made.