models:
  - name: stg_stripe__payments
    description: Model that cleans Stripe Payments data in Jaffle Shop. Cleans column names.
    columns:
      - name: payment_id
        data_type: integer
        description: Primary key. Unique ID of payment.

      - name: order_id
        data_type: integer
        description: Foreign key. ID of order related to the payment.

      - name: payment_method
        data_type: text
        description: Method that payment was made with.

      - name: payment_status
        data_type: text
        description: Status of the payment. Info if it passed or was rejected.

      - name: amount
        data_type: integer
        description: Payment value.

      - name: created
        data_type: date
        description: When payment was made.