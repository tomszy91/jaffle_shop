models:
  - name: stg_stripe__payment
    description: Model that cleans Stripe Payments data in Jaffle Shop. Cleans column names.
    columns:
      - name: payment_id
        data_type: integer
        description: Primary key. Unique ID of payment.
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_type: integer
        description: Foreign key. ID of order related to the payment.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_jaffle_shop__orders')
                field: order_id

      - name: payment_method
        data_type: text
        description: "{{ doc('payment_method') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['coupon', 'credit_card', 'bank_transfer', 'gift_card']

      - name: payment_status
        data_type: text
        description: "{{ doc('payment_status') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fail', 'success']

      - name: amount
        data_type: integer
        description: Payment value.
        data_tests:
          - not_null
          - not_negative

      - name: created
        data_type: date
        description: When payment was made.
          - not_null
          - not_before_date