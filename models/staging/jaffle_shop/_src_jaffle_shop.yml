sources:
  - name: jaffle_shop
    database: raw
    schema: raw_source            
    tables:
      - name: jaffle_shop_customers
        describe: Raw data of Jaffle Shop customers. Each row is one customer.
        columns:
          - name: id
            data_type: integer
            describe: Primary key. Unique ID of customer.
            
          - name: first_name
            data_type: text
            describe: Customer first name.

          - name: last_name
            data_type: text
            describe: Customer last name.

      - name: jaffle_shop_orders
        describe: Raw data of Jaffle Shop orders. Each row is one order.
        columns:
          - name: id
            data_type: integer
            describe: Primary key. Unique ID of the order.

          - name: user_id
            data_type: integer
            describe: Foreign key. ID of customer who made the order.

          - name: order_date
            data_type: date
            describe: When order was made.

          - name: status
            data_type: text
            describe: Current status of the order.