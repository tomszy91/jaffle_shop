models:
  - name: stg_jaffle_shop__customers
    description: Model that cleans Jaffle Shop customers data. Cleans column names.
    columns:
      - name: customer_id
        data_type: integer
        description: Primary key. Unique ID of customer.
        data_tests:
          - not_null
          - unique

      - name: first_name
        data_type: text
        description: Customer first name.
        data_tests:
          - not_null

      - name: last_name
        data_type: text
        description: Customer last name.
        data_tests:
          - not_null        

  - name: stg_jaffle_shop__orders
    description: Model that cleans Jaffle Shop orders data. Cleans column names.
    columns:
      - name: order_id
        data_type: integer
        description: Primary key. Unique ID of the order.
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_type: integer
        description: Foreign key. ID of customer who made the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref("stg_jaffle_shop__customers")
                field: customer_id

      - name: order_date
        data_type: date
        description: When order was made.
        data_tests:
          - not_null
          - correct_date

      - name: order_status
        data_type: text
        description: {{ doc("order_status") }}
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["return_pending", "returned", "completed", "placed", "shipped"]